version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hackathon_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackathon
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    restart: always
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - WORKER_POOL_SIZE=${WORKER_POOL_SIZE}
      - DB_MAX_CONNS=${DB_MAX_CONNS}
      - DB_MIN_CONNS=${DB_MIN_CONNS}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
      - COMETCHAT_APP_ID=${COMETCHAT_APP_ID}
      - COMETCHAT_REGION=${COMETCHAT_REGION}
      - COMETCHAT_API_KEY=${COMETCHAT_API_KEY}
      - COMETCHAT_AUTH_KEY=${COMETCHAT_AUTH_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHATBOT_UID=${CHATBOT_UID}
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_COMETCHAT_APP_ID=${COMETCHAT_APP_ID}
        - NEXT_PUBLIC_COMETCHAT_REGION=${COMETCHAT_REGION}
        - NEXT_PUBLIC_COMETCHAT_AUTH_KEY=${COMETCHAT_AUTH_KEY}
    container_name: hackathon_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_COMETCHAT_APP_ID=${COMETCHAT_APP_ID}
      - NEXT_PUBLIC_COMETCHAT_REGION=${COMETCHAT_REGION}
      - NEXT_PUBLIC_COMETCHAT_AUTH_KEY=${COMETCHAT_AUTH_KEY}
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: