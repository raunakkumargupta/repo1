version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hackathon_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackathon
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/hackathon?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_jwt_key
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - WORKER_POOL_SIZE=50
      - DB_MAX_CONNS=100
      - DB_MIN_CONNS=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=/api
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
